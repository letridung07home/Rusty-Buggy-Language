name: Nightly Fuzz

on:
  schedule:
    # Deep, coverage-guided fuzzing against main every night at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Fuzz run duration in minutes (1-180)
        required: false
        default: 1
        type: number

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: Coverage-guided fuzzing of the evaluate entry point
    runs-on: ubuntu-latest
    # Generous ceiling so manual runs can request up to 180 minutes plus
    # toolchain install and build time.
    timeout-minutes: 240
    env:
      # Scheduled runs keep the full nightly budget of 30 minutes; manual
      # runs use the requested duration (default 1 minute for a quick check).
      DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || 30 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libFuzzer's sanitizer coverage is only available on the nightly
      # toolchain; the fuzz crate is excluded from the stable and MSRV CI jobs.
      # The date is pinned so the rust-cache key stays stable across days; a
      # floating nightly would throw the cache away every night. Bump the
      # date periodically to pick up newer nightly fixes.
      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-08-25

      # Caches the fuzz workspace's dependency build (libfuzzer-sys and its
      # C++ runtime) plus the installed cargo-fuzz binary. The version is
      # part of the key so bumping it starts a fresh cache.
      - name: Cache Cargo artifacts
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cargo-fuzz-0.13.2
          workspaces: "fuzz -> target"

      # Skip the ~3 minute compile when the binary was restored from cache.
      - name: Install cargo-fuzz 0.13.2
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # cargo-fuzz builds the target in release mode by default.
      # `-max_total_time` bounds the whole run and `-timeout` bounds each
      # individual input, so a hang fails the job instead of stalling it. A
      # clean exit means no crash, panic, overflow, or hang was found in the
      # window.
      - name: Fuzz the evaluate entry point
        id: fuzz
        run: |
          # Enforce the documented 1-180 minute window even for manual
          # workflow_dispatch values. A value of 0 or less would otherwise
          # mean -max_total_time=0 (unbounded in libFuzzer), and anything
          # above 180 would run until the 240-minute job timeout kills it.
          duration=$(( DURATION_MINUTES < 1 ? 1 : DURATION_MINUTES ))
          duration=$(( duration > 180 ? 180 : duration ))
          cargo fuzz run evaluate -- -max_total_time=$(( duration * 60 )) -timeout=10 -print_final_stats=1
        shell: bash

      # libFuzzer writes the crashing input to fuzz/artifacts/<target>/ when
      # it finds a crash, panic, or hang; attach it to the run for download.
      - name: Upload crash artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-input
          path: fuzz/artifacts/
          if-no-files-found: warn

      # File an issue so a crash found overnight is actionable. The title is
      # deduplicated, so repeated nightly failures comment on the existing
      # issue instead of opening new ones.
      - name: File issue for fuzz failure
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Nightly fuzz found a crash, panic, or hang";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // Clamp to the same 1-180 minute window the fuzz step enforces;
            // 0, negative, or unparseable values report the 1-minute minimum.
            const duration = Math.min(Math.max(Number(process.env.DURATION_MINUTES) || 1, 1), 180);
            const body = [
              `The nightly coverage-guided fuzz run failed on \`main\` at commit \`${context.sha.slice(0, 7)}\`.`,
              "",
              `- Workflow run: ${runUrl}`,
              "- Fuzz target: `evaluate`",
              `- Duration: ${duration} minutes`,
              "",
              "The crashing input is attached to the run as the `fuzz-crash-input` artifact when produced.",
              "",
              "Reproduce locally with: `cargo fuzz run evaluate -- <path-to-crash-input>`",
            ].join("\n");

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} in:title "${title}" is:issue is:open`,
            });
            if (existing.data.total_count > 0) {
              const issue = existing.data.items[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Failed again: ${runUrl}`,
              });
              console.log(`Commented on existing issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              console.log(`Created issue #${created.data.number}`);
            }
