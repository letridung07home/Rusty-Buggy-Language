name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust with target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusty-buggy-language-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/rusty-buggy-language${{ matrix.suffix }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag and package version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact numeric SemVer tag (vX.Y.Z): ${TAG_NAME}." >&2
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${TAG_NAME}^{commit}" >/dev/null; then
            echo "Release tag ${TAG_NAME} was not fetched exactly." >&2
            exit 1
          fi

          version="${TAG_NAME#v}"
          package_version="$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ { in_package=0 }
            in_package && $0 ~ /^version[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*/, "")
              gsub(/[[:space:]\"]/, "")
              print
              exit
            }
          ' Cargo.toml)"
          if [[ -z "$package_version" || "$package_version" != "$version" ]]; then
            echo "Tag ${TAG_NAME} does not match Cargo.toml version ${package_version:-<missing>}." >&2
            exit 1
          fi

      - name: Extract changelog entry
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > RELEASE_NOTES.md

          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "No nonempty changelog entry found for ${TAG_NAME}." >&2
            exit 1
          fi

          semver_tags="$(git tag --list | awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/')"
          previous_tag="$(printf '%s\n' "$semver_tags" | sort -V | awk -v current="$TAG_NAME" '
            $0 == current { print previous; exit }
            { previous=$0 }
          ')"

          if [[ -n "$previous_tag" ]]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$SERVER_URL" "$REPOSITORY" "$previous_tag" "$TAG_NAME" >> RELEASE_NOTES.md
          fi

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release with binaries
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: RBL ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          generate_release_notes: false
