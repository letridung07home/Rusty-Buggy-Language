name: Release

on:
  push:
    tags:
      - "v*"
  # Lets a release be re-created on demand from the Actions tab, e.g. when
  # an asset upload failed after the tag was pushed, without retagging.
  # Supply the existing tag; the run builds and publishes exactly that tag.
  workflow_dispatch:
    inputs:
      tag_name:
        description: SemVer tag to build and release (e.g. v1.7.0)
        required: true
        type: string

# The tag comes from the dispatch input on manual runs and from the pushed
# ref on tag events; every job checks out and publishes this exact tag.
env:
  TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}

# Least privilege: only the job that publishes the release needs write
# access to repository contents; test and build jobs only read.
permissions:
  contents: read

jobs:
  # The tag run must be self-validating: CI does trigger on the v* tag
  # push, but its jobs run in parallel with this workflow and could fail
  # after the release is already published. Gate the build matrix on the
  # release-mode suite so a tag only ships when its tests pass here.
  test:
    name: Release-mode tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-workspace-crates: "true"

      - name: Run tests in release mode
        run: cargo test --release --all-targets --all-features

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: rusty-buggy-language-linux
            suffix: ""
          # Native arm64 runner, so no cross-compilation is needed; the
          # name carries the arch to stay distinct from the x86_64 build.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: rusty-buggy-language-linux-arm64
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            name: rusty-buggy-language-macos
            suffix: ""
          # Intel macOS is cross-compiled on the arm64 runner: GitHub
          # retired its last x86_64 images (macos-13) in December 2025,
          # and this dependency-free crate links fine with clang's
          # universal SDK on the arm64 host.
          - os: macos-latest
            target: x86_64-apple-darwin
            name: rusty-buggy-language-macos-x86_64
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: rusty-buggy-language-windows
            suffix: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Install stable Rust with target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      # Each matrix entry (OS + target triple) gets its own cache via the
      # toolchain- and job-based cache key.
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-workspace-crates: "true"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Give each binary a unique platform-suffixed name so builds that
      # share the underlying file name `rusty-buggy-language` never
      # clobber each other; the arch is part of the name where a platform
      # ships more than one binary. The checksum file and the published
      # release assets then stay unambiguous.
      - name: Stage platform-named binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/rusty-buggy-language${{ matrix.suffix }}"
          name="${{ matrix.name }}${{ matrix.suffix }}"
          cp -- "$bin" "$name"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}${{ matrix.suffix }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.TAG_NAME }}

      - name: Validate release tag and package version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact numeric SemVer tag (vX.Y.Z): ${TAG_NAME}." >&2
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${TAG_NAME}^{commit}" >/dev/null; then
            echo "Release tag ${TAG_NAME} was not fetched exactly." >&2
            exit 1
          fi

          version="${TAG_NAME#v}"
          package_version="$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ { in_package=0 }
            in_package && $0 ~ /^version[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*/, "")
              gsub(/[[:space:]\"]/, "")
              print
              exit
            }
          ' Cargo.toml)"
          if [[ -z "$package_version" || "$package_version" != "$version" ]]; then
            echo "Tag ${TAG_NAME} does not match Cargo.toml version ${package_version:-<missing>}." >&2
            exit 1
          fi

      - name: Extract changelog entry
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          awk -v version="$version" '
            BEGIN {
              # Require the line to start with the exact "## [X.Y.Z]" header
              # so extracting 1.6.1 can never match a 1.6.10 section above it.
              needle = "## [" version "]"
            }
            substr($0, 1, length(needle)) == needle { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > RELEASE_NOTES.md

          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "No nonempty changelog entry found for ${TAG_NAME}." >&2
            exit 1
          fi

          semver_tags="$(git tag --list | awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/')"
          previous_tag="$(printf '%s\n' "$semver_tags" | sort -V | awk -v current="$TAG_NAME" '
            $0 == current { print previous; exit }
            { previous=$0 }
          ')"

          if [[ -n "$previous_tag" ]]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$SERVER_URL" "$REPOSITORY" "$previous_tag" "$TAG_NAME" >> RELEASE_NOTES.md
          fi

      # v8 is the current downloader major and is required to read artifacts
      # uploaded by upload-artifact v5+ (the artifact backend changed there).
      # Each artifact lands in its own subdirectory (merge-multiple would
      # clobber same-named binaries across platforms).
      - name: Download prebuilt binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      # Flatten the platform binaries (now uniquely named) into the workspace,
      # then hash them so users can verify the published artifacts.
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          # Flatten the uniquely-named platform binaries out of their
          # per-artifact subdirectories into one directory for release.
          find dist -type f -name 'rusty-buggy-language*' -exec cp -f {} assets/ \;
          cd assets
          # `--` keeps filenames beginning with a dash from being read as
          # options (shellcheck SC2035); the SHA256SUMS file itself is
          # created by the redirect after the glob is expanded.
          sha256sum -- * > SHA256SUMS
          echo "Checksums written:"
          cat SHA256SUMS

      - name: Publish GitHub release with binaries
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: RBL ${{ env.TAG_NAME }}
          body_path: RELEASE_NOTES.md
          files: |
            assets/*
          generate_release_notes: false
