name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stable:
    name: Stable quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # This crate has no external dependencies, so cache the crate's own
      # build artifacts to make re-runs of the same commit cheap.
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-workspace-crates: "true"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --all-targets --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  coverage:
    name: Line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust with LLVM tools
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      # Caches the installed cargo-llvm-cov binary (~/.cargo/bin). Workspace
      # artifacts are excluded because cargo-llvm-cov rebuilds them with
      # coverage instrumentation anyway.
      - name: Cache Cargo artifacts
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Skip the compile when the binary was restored from cache.
      - name: Install cargo-llvm-cov
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked

      # Prints the summary and fails the job when total line coverage drops
      # below 80%, so blind spots are visible in CI. Tune the threshold to
      # the measured baseline after the first run.
      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --fail-under-lines 80

      # Uploads only when a CODECOV_TOKEN secret is configured. v5 supports
      # tokenless uploads for public repos; the gate can be dropped once the
      # repository is set up on Codecov.
      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          fail_ci_if_error: false

  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Catches YAML, expression, and shell errors in workflow files at PR
      # time instead of on a release tag, and annotates PRs via a problem
      # matcher. Uses the actionlint release pinned inside the action.
      - name: Run actionlint
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13

  msrv:
    name: Rust 1.70 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.70
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.70.0

      # Cached separately from the stable job via the toolchain-specific key.
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-workspace-crates: "true"

      - name: Check compilation
        run: cargo check --all-targets --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features