name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  # Lets the full suite be triggered on demand from the Actions tab or
  # with `gh workflow run CI`, e.g. to re-check a branch.
  workflow_dispatch:

# Pushes to the same branch or PR supersede each other: a newer run
# cancels the stale in-flight one instead of both consuming runners.
# Tag refs are unique, so tag-triggered runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stable:
    name: Stable quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # This crate has no external dependencies, so cache the crate's own
      # build artifacts to make re-runs of the same commit cheap.
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-workspace-crates: "true"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --all-targets --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features

      # --all-targets does not exercise doctests, so run them explicitly.
      - name: Run doctests
        run: cargo test --doc --all-features

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  coverage:
    name: Line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust with LLVM tools
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      # Caches the installed cargo-llvm-cov binary (~/.cargo/bin). Workspace
      # artifacts are excluded because cargo-llvm-cov rebuilds them with
      # coverage instrumentation anyway.
      - name: Cache Cargo artifacts
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Skip the compile when the binary was restored from cache.
      - name: Install cargo-llvm-cov
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked

      # Prints the per-file and total line-coverage summary and fails the
      # job when total coverage drops below 80%, so blind spots stay visible
      # in CI. Tune the threshold to the measured baseline.
      - name: Generate coverage summary
        run: cargo llvm-cov --all-features --fail-under-lines 80

  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Catches YAML, expression, and shell errors in workflow files at PR
      # time instead of on a release tag, and annotates PRs via a problem
      # matcher. Uses the actionlint release pinned inside the action.
      - name: Run actionlint
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13

  # Machine-checks the public library API with cargo-semver-checks. While
  # the breaking v2 window is open (v1.x -> v2.0) the job runs with
  # release-type: major, so the deliberate break is reported rather than
  # treated as a regression. Once v2.0.0 ships, switch baseline-rev to the
  # v2.0.0 tag at the v2.1 release so later 2.x releases stay backward
  # compatible with the v2 contract.
  semver:
    name: Check public API compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline release tag must be present locally, so fetch the
          # full history and all tags rather than the default shallow clone.
          fetch-depth: 0

      - name: Check API compatibility
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          release-type: major

  msrv:
    name: Rust 1.70 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.70
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.70.0

      # Cached separately from the stable job via the toolchain-specific key.
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-workspace-crates: "true"

      - name: Check compilation
        run: cargo check --all-targets --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run doctests
        run: cargo test --doc --all-features

  # Release builds disable debug assertions and unchecked-arithmetic
  # overflow panics, so run the whole suite once in release mode to match
  # the binaries we actually ship.
  release:
    name: Release-mode tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-workspace-crates: "true"

      - name: Run tests in release mode
        run: cargo test --release --all-targets --all-features